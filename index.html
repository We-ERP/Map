<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خريطة البلوكات الذكية | مصر</title>
  <meta name="description" content="نظام خرائط تفاعلي لتقسيم المناطق في مصر إلى بلوكات وقطع وتصديرها بدقة عالية." />
  <meta name="theme-color" content="#0E1A24" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="" />

  <!-- App styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="map" aria-label="خريطة المنطقة"></div>

  <!-- ===== Top bar ===== -->
  <header class="topbar" role="banner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <rect x="2" y="2" width="28" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M2 16h28M16 2v28" stroke="currentColor" stroke-width="1.2" opacity=".45"/>
          <circle cx="16" cy="16" r="3.5" fill="#E8A33D"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>خريطة البلوكات</h1>
        <span id="activeAreaLabel">المرج - القاهرة</span>
      </div>
    </div>

    <form id="searchForm" class="search" role="search" autocomplete="off">
      <label for="areaInput" class="sr-only">ابحث عن منطقة</label>
      <input id="areaInput" type="search" placeholder="اكتب اسم المنطقة (مثال: مدينة نصر، الزمالك...)" />
      <button type="submit" class="btn btn-primary" id="searchBtn">عرض المنطقة</button>
    </form>

    <div class="topbar-actions">
      <button class="icon-btn" id="themeBtn" title="تبديل الوضع الليلي/النهاري" aria-label="تبديل الثيم">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="currentColor"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="panelToggle" title="إظهار/إخفاء لوحة التحكم" aria-label="لوحة التحكم">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 4h18v2H3zm0 7h12v2H3zm0 7h18v2H3z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Control panel ===== -->
  <aside class="panel" id="panel" aria-label="لوحة التحكم">

    <section class="card">
      <div class="card-head">
        <h2>تقسيم البلوكات</h2>
        <span class="chip" id="blockCountChip">35 بلوك</span>
      </div>

      <div class="preset-row" role="group" aria-label="أعداد جاهزة">
        <button class="preset" data-count="35">35</button>
        <button class="preset" data-count="53">53</button>
        <div class="custom-count">
          <input id="customCount" type="number" min="2" max="200" value="35" aria-label="عدد مخصص" />
          <button class="btn btn-ghost" id="applyCount">تطبيق</button>
        </div>
      </div>

      <div class="field-row">
        <label for="colorSeed">تنويع الألوان</label>
        <input id="colorSeed" type="range" min="0" max="359" value="28" />
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>طبقة الخريطة</h2></div>
      <div class="segmented" id="layerSegment" role="radiogroup" aria-label="نوع الخريطة">
        <button data-layer="streets" class="is-active" role="radio" aria-checked="true">شوارع</button>
        <button data-layer="osm" role="radio" aria-checked="false">OSM</button>
        <button data-layer="satellite" role="radio" aria-checked="false">قمر صناعي</button>
        <button data-layer="hybrid" role="radio" aria-checked="false">هجين</button>
      </div>
      <div class="toggle-list">
        <label class="toggle"><input type="checkbox" id="toggleParcels" checked /> <span>القطع والمباني</span></label>
        <label class="toggle"><input type="checkbox" id="toggleStreets" checked /> <span>الشوارع</span></label>
        <label class="toggle"><input type="checkbox" id="toggleLabels" checked /> <span>أرقام البلوكات</span></label>
        <label class="toggle"><input type="checkbox" id="toggleHouseNumbers" /> <span>أرقام البيوت</span></label>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>بحث داخل المنطقة</h2></div>
      <input id="innerSearch" type="search" class="input" placeholder="رقم بلوك، شارع، أو رقم بيت" />
      <ul id="searchResults" class="results" aria-live="polite"></ul>
    </section>

    <section class="card">
      <div class="card-head"><h2>التصدير</h2></div>
      <div class="export-grid">
        <button class="btn btn-accent" id="exportBlockBtn" disabled>تصدير البلوك المحدد</button>
        <button class="btn" id="exportFullBtn" disabled>تصدير الخريطة كاملة</button>
        <button class="btn" id="exportBatchBtn" disabled>كل البلوكات (ZIP)</button>
      </div>
      <div class="field-row">
        <label for="exportPreset">جودة الصورة</label>
        <select id="exportPreset" class="input">
          <option value="4000">4K (4000 بكسل)</option>
          <option value="3508" selected>طباعة A3 بدقة 300 DPI</option>
          <option value="2480">طباعة A4 بدقة 300 DPI</option>
        </select>
      </div>
      <div class="field-row">
        <label for="exportFormat">الصيغة</label>
        <select id="exportFormat" class="input">
          <option value="png" selected>PNG (بدون فقد)</option>
          <option value="jpeg">JPEG</option>
        </select>
      </div>
    </section>

    <section class="card stats-card" id="statsCard">
      <div class="stat"><span class="stat-value" id="statBlocks">0</span><span class="stat-label">بلوك</span></div>
      <div class="stat"><span class="stat-value" id="statParcels">0</span><span class="stat-label">قطعة</span></div>
      <div class="stat"><span class="stat-value" id="statStreets">0</span><span class="stat-label">شارع</span></div>
    </section>

    <p class="data-note" id="dataNote"></p>
  </aside>

  <!-- ===== Inspector drawer ===== -->
  <aside class="inspector" id="inspector" aria-hidden="true" aria-label="تفاصيل العنصر">
    <div class="inspector-head">
      <div>
        <p class="inspector-kicker" id="inspKicker">—</p>
        <h3 id="inspTitle">اختر بلوكًا أو قطعة</h3>
      </div>
      <button class="icon-btn" id="inspClose" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
    <div class="inspector-body" id="inspBody"></div>
    <div class="inspector-foot">
      <button class="btn btn-accent" id="inspExport">تصدير هذا البلوك</button>
      <button class="btn btn-ghost" id="inspZoom">تكبير عليه</button>
    </div>
  </aside>

  <!-- ===== Progress overlay ===== -->
  <div class="progress" id="progress" hidden role="status" aria-live="polite">
    <div class="progress-card">
      <p id="progressTitle">جارٍ التحميل</p>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressText">0%</span>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" hidden></div>

  <!-- ===== Scripts ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="exporter.js"></script>
  <script src="app.js"></script>
</body>
</html>
