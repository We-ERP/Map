name: Fetch Egypt GIS data and render blocks

# يشغّل السكريبت من زر في GitHub، ثم:
#  1) يحفظ ملف GeoJSON داخل الريبو (لعرض الموقع)
#  2) يرسم صورة PNG لكل بلوك ويجمعها في ZIP تنزّله من صفحة التشغيل
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'اسم المنطقة (مثال: المرج، القاهرة، مصر)'
        required: true
        default: 'المرج، القاهرة، مصر'
        type: string
      output:
        description: 'مسار ملف GeoJSON'
        required: true
        default: 'data/marg-cairo.geojson'
        type: string
      blocks:
        description: 'عدد البلوكات (35 أو 53 أو أي رقم)'
        required: true
        default: '35'
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests shapely numpy matplotlib arabic-reshaper

      - name: Fetch data from OpenStreetMap
        env:
          QUERY: ${{ inputs.query }}
          OUTPUT: ${{ inputs.output }}
        run: python fetch_egypt_gis.py --query "$QUERY" --out "$OUTPUT"

      - name: Render block images (ZIP)
        env:
          OUTPUT: ${{ inputs.output }}
          BLOCKS: ${{ inputs.blocks }}
          QUERY: ${{ inputs.query }}
        run: |
          python render_blocks.py --geojson "$OUTPUT" --blocks "$BLOCKS" \
            --out out/blocks --dpi 200 --size-in 12 --name "$QUERY"

      - name: Upload block images as downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: blocks-images
          path: out/blocks.zip
          retention-days: 30

      - name: Commit the GeoJSON file
        env:
          OUTPUT: ${{ inputs.output }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT"
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة"
          else
            git commit -m "data: update $OUTPUT"
            git push
          fi
